services:
  db:
    image: mysql:8.0
    container_name: chill-db-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-chill_db}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - chill_mysql_data:/var/lib/mysql
      - ./database/chill_db_schema_final_fachrezi.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/chill_data_only.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  chill_mysql_data:
